<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bordado Japonês — Descubra seu caminho | Mari Nonaka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E31C6F;
    --pink-dark:#B8125A;
    --pink-light:#FBDCE9;
    --pink-lighter:#FDF0F5;
    --bg:#FDF6F2;
    --card:#FBE0EA;
    --card-hover:#F8D0E1;
    --ink:#2B2024;
    --ink-soft:#8A757A;
    --ink-faint:#B9A8AC;
    --white:#FFFFFF;
    --green:#2FAE6B;
    --green-dark:#1F7A4A;
    --shadow-sm:0 4px 14px rgba(178,20,90,.08);
    --shadow-md:0 10px 30px rgba(178,20,90,.12);
    --shadow-lg:0 20px 50px rgba(178,20,90,.16);
    --shadow-card:0 10px 22px rgba(178,20,90,.14);
    --shadow-green:0 10px 26px rgba(47,174,107,.35);
    --shadow-green-lg:0 16px 34px rgba(47,174,107,.5);
    --radius-lg:26px;
    --radius-md:20px;
    --radius-sm:14px;
    --radius-pill:999px;
    --font-serif:'Playfair Display', Georgia, serif;
    --font-sans:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --container:600px;
    --side-pad:20px;
    --bar-h:156px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img,svg{display:block; max-width:100%;}
  button{font-family:inherit; border:none; background:none; cursor:pointer; -webkit-appearance:none;}
  ul{margin:0; padding:0; list-style:none;}
  p{margin:0;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- Shell ---------- */
  .page{
    max-width:var(--container);
    margin:0 auto;
    min-height:100vh;
    position:relative;
    background:var(--bg);
  }

  .topbar{
    position:fixed;
    top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:var(--container);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px var(--side-pad) 10px;
    background:linear-gradient(var(--bg) 82%, transparent);
    z-index:40;
  }
  .topbar-logo{
    width:88px; height:88px; display:block; margin:0 auto;
    filter:drop-shadow(0 4px 10px rgba(178,20,90,.2));
  }
  .topbar-progress-row{
    width:100%; display:flex; align-items:center; gap:14px;
  }
  .topbar-progress-row.hidden{visibility:hidden;}
  .back-btn{
    width:34px; height:34px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    border-radius:var(--radius-pill);
    transition:background .15s;
  }
  .back-btn:hover{background:rgba(0,0,0,.04);}
  .back-btn.invisible{visibility:hidden;}
  .progress-track{
    flex:1; height:6px; background:var(--pink-light);
    border-radius:var(--radius-pill); overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--pink);
    border-radius:var(--radius-pill);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  main#app{
    padding:calc(var(--bar-h) + 20px) var(--side-pad) 56px;
    min-height:100vh;
  }

  main#app.anim{animation:stepIn .36s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes stepIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Typography ---------- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--pink-light); color:var(--pink-dark);
    font-weight:700; font-size:12.5px; letter-spacing:.02em;
    padding:7px 14px; border-radius:var(--radius-pill);
    margin-bottom:16px;
  }
  h1,h2,h3{font-family:var(--font-serif); font-weight:600; color:var(--ink); margin:0;}
  .headline{
    font-size:clamp(24px,6.4vw,30px);
    line-height:1.2;
    letter-spacing:-.01em;
    margin-bottom:14px;
  }
  .headline.center{text-align:center;}
  .headline .accent{color:var(--pink); font-style:italic;}
  .sub{
    font-size:15.5px; line-height:1.55; color:var(--ink-soft);
    max-width:52ch;
  }
  .sub.center{text-align:center; margin:0 auto;}
  .hint{font-size:13px; color:var(--ink-faint); margin-top:14px; text-align:center;}

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center;
    width:100%; min-height:56px;
    border-radius:var(--radius-pill);
    font-weight:700; font-size:14.5px;
    letter-spacing:.03em; text-transform:uppercase;
    padding:0 22px; text-align:center;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn-primary{
    background:var(--green); color:var(--white);
    box-shadow:var(--shadow-green);
    animation:ctaPulse 2.4s ease-in-out infinite;
  }
  .btn-primary:hover{animation-play-state:paused; transform:translateY(-1px); box-shadow:var(--shadow-green-lg);}
  .btn-primary:active{transform:translateY(0) scale(.99);}
  .btn-primary[disabled]{opacity:.35; box-shadow:none; animation:none; pointer-events:none;}
  @keyframes ctaPulse{
    0%,100%{ box-shadow:var(--shadow-green); transform:scale(1); }
    50%{ box-shadow:var(--shadow-green-lg); transform:scale(1.015); }
  }
  .btn-primary .arrow{margin-left:8px; font-size:16px;}
  .btn-ghost{
    background:transparent; color:var(--pink-dark);
    border:1.5px solid var(--pink-light);
  }
  .btn-row{margin-top:22px;}
  .btn-loading{position:relative; color:transparent !important;}
  .btn-loading::after{
    content:""; position:absolute; width:18px; height:18px;
    border-radius:50%; border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff; animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Choice cards ---------- */
  .choices{display:flex; flex-direction:column; gap:12px; margin-top:26px;}
  .choice-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card);
    border-radius:var(--radius-md);
    padding:14px 14px 14px 12px;
    min-height:64px;
    text-align:left;
    box-shadow:var(--shadow-card);
    transition:background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .choice-card:hover{background:var(--card-hover);}
  .choice-card:active{transform:scale(.985); box-shadow:var(--shadow-sm);}
  .choice-card.selected{box-shadow:0 10px 22px rgba(227,28,111,.28);}
  .choice-icon{
    width:42px; height:42px; flex:0 0 auto;
    background:var(--white); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; box-shadow:var(--shadow-sm);
  }
  .choice-label{flex:1; font-weight:600; font-size:15px; line-height:1.35; color:var(--ink);}
  .choice-check{
    width:30px; height:30px; flex:0 0 auto;
    border-radius:50%; border:1.6px solid var(--pink);
    color:var(--pink);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; transition:background .15s, color .15s;
  }
  .choice-card.multi .choice-check{border-radius:8px;}
  .choice-card.selected{background:var(--pink);}
  .choice-card.selected .choice-label{color:var(--white);}
  .choice-card.selected .choice-check{background:var(--white); color:var(--pink);}
  .choice-card.selected .choice-icon{background:rgba(255,255,255,.9);}

  /* ---------- Placeholder image block ---------- */
  .ph-image{
    position:relative;
    width:100%;
    border-radius:var(--radius-lg);
    background:linear-gradient(150deg,var(--pink-light) 0%,#f7c9dd 55%,var(--pink-light) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; overflow:hidden;
  }
  .ph-image .ph-icon{font-size:38px; opacity:.85;}
  .ph-image .ph-label{
    font-size:11.5px; font-weight:700; color:var(--pink-dark);
    background:rgba(255,255,255,.75); padding:5px 12px; border-radius:var(--radius-pill);
    letter-spacing:.01em; text-align:center; max-width:88%;
  }

  /* ---------- Landing ---------- */
  .landing-wrap{text-align:center;}
  .landing-logo{
    display:block; width:150px; height:150px; margin:16px auto 0;
    border-radius:50%; object-fit:cover;
    box-shadow:0 10px 26px rgba(178,20,90,.22), 0 0 0 4px var(--white);
  }
  .landing-hero-img{aspect-ratio:4/5; margin:26px 0 20px;}
  .hero-photo{
    width:100%; height:100%;
    object-fit:cover; object-position:center 18%;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
  }
  .landing-note{font-size:15px; color:var(--ink-soft); line-height:1.5; margin:20px 0 22px;}
  .social-block{margin-top:44px;}
  .social-title{font-family:var(--font-serif); font-size:20px; font-weight:600; text-align:center; margin-bottom:18px;}

  /* ---------- Carousel ---------- */
  .carousel{position:relative;}
  .carousel-track{
    display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding-bottom:4px; scrollbar-width:none;
  }
  .carousel-track::-webkit-scrollbar{display:none;}
  .t-card{
    scroll-snap-align:center;
    flex:0 0 100%;
    background:var(--white);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .t-photo{width:100%; aspect-ratio:4/5; object-fit:cover; object-position:center 12%; display:block;}
  .t-body{padding:16px 18px 20px;}
  .t-stars{color:var(--pink); font-size:14px; letter-spacing:2px; margin-bottom:8px;}
  .t-name{font-weight:800; font-size:14.5px;}
  .t-handle{font-size:12.5px; color:var(--ink-faint); margin-bottom:8px;}
  .t-quote{font-size:14px; line-height:1.55; color:var(--ink-soft);}
  .carousel-dots{display:flex; justify-content:center; gap:6px; margin-top:14px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--pink-light);}
  .dot.active{background:var(--pink); width:16px; border-radius:4px; transition:width .2s;}
  .carousel-arrow{
    position:absolute; top:38%; transform:translateY(-50%);
    width:36px; height:36px; border-radius:50%;
    background:var(--white); box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; color:var(--pink-dark);
    font-size:14px; z-index:5;
  }
  .carousel-arrow.prev{left:-4px;}
  .carousel-arrow.next{right:-4px;}

  .gallery-scroll{
    display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; margin-top:18px;
  }
  .gallery-scroll::-webkit-scrollbar{display:none;}
  .gallery-item{flex:0 0 96px; cursor:pointer;}
  .gallery-photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    border-radius:16px; border:2.5px solid transparent;
    transition:border-color .2s ease, transform .2s ease, opacity .2s ease;
    opacity:.75;
  }
  .gallery-item.active .gallery-photo{border-color:var(--pink); transform:scale(1.05); opacity:1;}

  /* ---------- Editorial ---------- */
  .editorial-img{aspect-ratio:4/5; margin:18px 0 20px;}
  .editorial-photo{
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
  }
  .editorial-cards{display:flex; flex-direction:column; gap:14px; margin:18px 0 20px;}
  .editorial-card-img{
    width:100%; display:block;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
  }
  .editorial-p{font-size:15px; line-height:1.65; color:var(--ink); margin-bottom:14px;}
  .highlight-list{display:flex; flex-direction:column; gap:10px; margin:20px 0 26px;}
  .highlight-item{
    display:flex; align-items:center; gap:10px;
    background:var(--pink-lighter); border:1px solid var(--pink-light);
    border-radius:var(--radius-sm); padding:12px 14px;
    font-size:14px; font-weight:600;
  }
  .highlight-item .mark{color:var(--green); font-size:15px; font-weight:800;}

  /* ---------- Micro diagnosis ---------- */
  .diag-loading{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 0; gap:18px;
  }
  .diag-dots{display:flex; gap:8px;}
  .diag-dots span{
    width:10px; height:10px; border-radius:50%; background:var(--pink);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .diag-dots span:nth-child(2){animation-delay:.15s;}
  .diag-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.8);} 40%{opacity:1; transform:scale(1);}}
  .diag-loading-text{font-size:14.5px; color:var(--ink-soft); font-weight:600;}
  .diag-reveal{text-align:center;}
  .diag-body{font-size:15.5px; line-height:1.7; color:var(--ink); margin:8px 0 30px;}
  .diag-body strong{color:var(--pink-dark);}

  /* ---------- Objection ---------- */
  .obj-img{aspect-ratio:5/4; margin:18px 0 18px;}
  .objection-photo{
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
  }
  .badge-pink{
    display:inline-block; background:var(--pink); color:var(--white);
    font-family:var(--font-serif); font-style:italic; font-weight:600; font-size:20px;
    padding:8px 26px; border-radius:var(--radius-pill); margin-bottom:16px;
    box-shadow:0 10px 20px rgba(178,20,90,.2);
  }
  .obj-p{font-size:15px; line-height:1.6; color:var(--ink); margin-bottom:10px;}
  .steps-seq{margin:22px 0 26px; display:flex; flex-direction:column; gap:0;}
  .step-row{display:flex; gap:14px; align-items:flex-start; padding:10px 0;}
  .step-num{
    width:28px; height:28px; border-radius:50%; background:var(--pink-light); color:var(--pink-dark);
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; margin-top:1px;
  }
  .step-row:not(:last-child){position:relative;}
  .step-row:not(:last-child)::after{
    content:""; position:absolute; left:13.5px; top:32px; bottom:-4px; width:1.5px;
    background:var(--pink-light);
  }
  .step-text{font-size:14.5px; font-weight:600; padding-top:4px;}

  /* ---------- Pre-VSL / VSL ---------- */
  .center-wrap{text-align:center; padding-top:26px;}
  .mari-avatar{
    width:76px; height:76px; border-radius:50%; margin:0 auto 20px;
    background:var(--pink-light); display:flex; align-items:center; justify-content:center;
    font-size:26px; box-shadow:var(--shadow-sm);
  }
  .vsl-video-wrap{
    position:relative; width:100%; max-width:300px; margin:26px auto 6px;
    aspect-ratio:9/16; border-radius:var(--radius-lg); overflow:hidden;
    background:#0f0a0c; box-shadow:var(--shadow-lg);
  }
  .vsl-video{width:100%; height:100%; object-fit:cover; display:block;}
  .vsl-progress-row{
    position:absolute; top:10px; left:10px; right:10px; height:3px;
    background:rgba(255,255,255,.3); border-radius:var(--radius-pill);
    overflow:hidden; z-index:3;
  }
  .vsl-progress-fill{
    height:100%; width:0%; background:#fff;
    border-radius:var(--radius-pill);
  }
  .vsl-mute-hint{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); color:#fff; font-size:12px; font-weight:700;
    padding:9px 16px; border-radius:var(--radius-pill); z-index:3;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }

  /* ---------- Processing ---------- */
  .proc-ring{
    width:64px; height:64px; border-radius:50%;
    border:4px solid var(--pink-light); border-top-color:var(--pink);
    animation:spin 1s linear infinite; margin:0 auto 26px;
  }
  .proc-msg{font-size:15px; font-weight:600; color:var(--ink); min-height:24px; transition:opacity .2s;}

  /* ---------- Results page ---------- */
  .results-hero{text-align:center; padding-top:8px;}
  .cert-block{text-align:center; margin:30px 0 8px;}
  .cert-label{font-size:12.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--pink-dark); margin-bottom:12px;}
  .cert-photo{
    width:100%; border-radius:var(--radius-md);
    box-shadow:var(--shadow-md); border:1px solid var(--pink-light);
  }
  .cert-caption{font-size:12.5px; color:var(--ink-soft); margin-top:10px;}
  .profile-card{
    background:var(--white); border:1px solid var(--pink-light);
    border-radius:var(--radius-lg); padding:22px 20px; margin:26px 0;
    box-shadow:var(--shadow-sm); text-align:left;
  }
  .profile-title{
    font-family:var(--font-sans); font-weight:800; font-size:13px; letter-spacing:.05em;
    color:var(--pink-dark); text-transform:uppercase; margin-bottom:16px;
  }
  .profile-row{display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-top:1px solid var(--pink-lighter);}
  .profile-row:first-of-type{border-top:none;}
  .profile-k{font-size:13.5px; color:var(--ink-soft); font-weight:600;}
  .profile-v{font-size:13.5px; color:var(--ink); font-weight:700; text-align:right; max-width:58%;}
  .reco-box{
    background:var(--pink-lighter); border-radius:var(--radius-md); padding:16px 18px;
    margin:8px 0 18px; font-size:14.5px; font-weight:700; color:var(--pink-dark); text-align:left;
  }
  .personal-note{font-size:14.5px; line-height:1.65; color:var(--ink); text-align:left; margin-bottom:12px;}
  .transition-line{
    font-family:var(--font-serif); font-size:19px; font-weight:600; text-align:center;
    margin:30px 0 6px;
  }

  .section-block{margin-top:52px;}
  .section-title{font-family:var(--font-serif); font-size:22px; font-weight:600; text-align:center; margin-bottom:20px; line-height:1.3;}

  /* Offer card */
  .offer-card{
    background:var(--white); border-radius:28px; padding:26px 22px;
    box-shadow:var(--shadow-lg); border:2px solid var(--pink);
    position:relative; margin-top:14px;
  }
  .offer-badge{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    background:var(--pink); color:var(--white); font-size:11.5px; font-weight:800;
    letter-spacing:.04em; padding:6px 16px; border-radius:var(--radius-pill); white-space:nowrap;
  }
  .offer-name{font-family:var(--font-serif); font-size:22px; font-weight:700; text-align:center; margin:10px 0 4px;}
  .offer-hero-photo{
    display:block; width:78%; max-width:280px; margin:14px auto 4px;
  }
  .offer-sub{font-size:13.5px; color:var(--ink-soft); text-align:center; margin-bottom:20px;}
  .offer-list{display:flex; flex-direction:column; gap:11px; margin-bottom:22px;}
  .offer-item{display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.4;}
  .offer-item .mark{color:var(--green); font-weight:800; flex:0 0 auto;}
  .offer-price-block{text-align:center; padding:18px 0 6px; border-top:1px dashed var(--pink-light);}
  .offer-price-anchor{font-size:14px; color:var(--ink-faint); text-decoration:line-through;}
  .offer-price-now{font-family:var(--font-serif); font-size:38px; font-weight:700; color:var(--pink-dark); line-height:1.1;}
  .offer-price-note{font-size:12.5px; color:var(--ink-soft); margin-top:2px; margin-bottom:18px;}

  /* value stack */
  .value-stack{background:var(--pink-lighter); border-radius:var(--radius-md); padding:18px 20px; margin-top:28px;}
  .value-lead{font-family:var(--font-serif); font-size:17px; font-weight:600; text-align:center; margin-bottom:16px;}
  .value-row{display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0; border-bottom:1px dashed rgba(178,20,90,.15);}
  .value-row.total{font-weight:800; border-bottom:none; padding-top:12px;}
  .value-row .k{color:var(--ink-soft);}
  .value-row .v{font-weight:700;}

  /* mini testimonials near offer */
  .mini-t-grid{display:flex; flex-direction:column; gap:12px; margin-top:18px;}
  .mini-t{
    background:var(--white); border-radius:var(--radius-md); padding:16px 18px;
    box-shadow:var(--shadow-sm); display:flex; gap:12px; align-items:flex-start;
  }
  .mini-t-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--pink-light); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .mini-t-avatar-photo{
    width:38px; height:38px; border-radius:50%; object-fit:cover; flex:0 0 auto;
  }
  .mini-t-name{font-weight:800; font-size:13.5px;}
  .mini-t-stars{color:var(--pink); font-size:11px; margin:2px 0 4px;}
  .mini-t-quote{font-size:13px; line-height:1.5; color:var(--ink-soft);}

  /* guarantee */
  .guarantee-box{

/* ---------------- Tracking stub ---------------- */
function track(eventName, payload){
  var data = Object.assign({ event: eventName, ts: Date.now() }, payload || {});

  try{ if (typeof window.fbq === 'function') window.fbq('trackCustom', eventName, payload || {}); }catch(e){}
  try{ if (typeof window.gtag === 'function') window.gtag('event', eventName, payload || {}); }catch(e){}
  try{ if (window.dataLayer) window.dataLayer.push(data); }catch(e){}
}

var FLOW = ['landing','q_experiencia','q_cursos','q_tempo','editorial','q_desejo','q_meta','q_estilos','microdiag','objection','socialproof','prevsl','vsl','processing','results'];
var PROGRESS_IDS = FLOW.filter(function(id){ return id !== 'landing' && id !== 'results'; });

var currentId = 'landing';
var historyStack = [];

function goTo(id){
  historyStack.push(currentId);
  currentId = id;
  renderCurrent();
}
function goBack(){
  if(historyStack.length === 0) return;
  currentId = historyStack.pop();
  renderCurrent();
}
function next(id){
  var i = FLOW.indexOf(id);
  return FLOW[i+1];
}

/* ---------------- Mount / chrome ---------------- */
var appEl = document.getElementById('app');
var topbarEl = document.getElementById('topbar');
var backBtn = document.getElementById('backBtn');
var progressFill = document.getElementById('progressFill');

backBtn.addEventListener('click', goBack);

function mount(html){
  appEl.innerHTML = html;
  appEl.classList.remove('anim');
  void appEl.offsetWidth;
  appEl.classList.add('anim');
  window.scrollTo(0,0);
}

function updateChrome(id){
  var progressWrap = document.getElementById('topbarProgressWrap');
  if(id === 'landing' || id === 'results'){
    progressWrap.classList.add('hidden');
  }else{
    progressWrap.classList.remove('hidden');
    var pct = ((PROGRESS_IDS.indexOf(id)+1) / PROGRESS_IDS.length) * 100;
    progressFill.style.width = pct + '%';
    backBtn.classList.toggle('invisible', id === 'q_experiencia' || historyStack.length === 0);
  }
}

function renderCurrent(){
  var html = RENDERERS[currentId]();
  mount(html);
  updateChrome(currentId);
  if(AFTER[currentId]) AFTER[currentId]();
}

/* ---------------- Small helpers ---------------- */

function renderChoiceScreen(cfg){
  var opts = OPTIONS[cfg.key];

    return '<button class="choice-card" data-idx="' + idx + '">' +
      '<span class="choice-icon">' + o.e + '</span>' +
      '<span class="choice-label">' + o.t + '</span>' +

        '<svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5l3.5 3.5L12 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</span>' +
    '</button>';
  }).join('');

  return '<div>' +
    '<h1 class="headline">' + cfg.headline + '</h1>' +
    (cfg.sub ? '<p class="sub">' + cfg.sub + '</p>' : '') +
    '<div class="choices">' + cardsHtml + '</div>' +
    '<p class="hint">Personalizamos o seu plano de acordo com suas respostas.</p>' +
  '</div>';
}

function bindChoiceScreen(cfg){
  var cards = appEl.querySelectorAll('.choice-card');
  cards.forEach(function(card){
    card.addEventListener('click', function(){
      if(card.classList.contains('selected')) return;
      cards.forEach(function(c){ c.classList.remove('selected'); });
      card.classList.add('selected');
      var idx = parseInt(card.getAttribute('data-idx'), 10);
      var chosen = OPTIONS[cfg.key][idx];
      state[cfg.key] = chosen.v;
      track('quiz_answered', { question: cfg.key, value: chosen.v });
      setTimeout(function(){ goTo(next(currentId)); }, 260);
    });
  });
}

AFTER.vsl = function(){
  var video = document.getElementById('vslVideo');
  var fill = document.getElementById('vslProgressFill');
  var muteHint = document.getElementById('vslMuteHint');
  var milestones = { started:false, 25:false, 50:false, 75:false, completed:false };

  function showMuteHint(show){
    muteHint.style.display = show ? 'flex' : 'none';
  }

  // Tenta tocar já com som (aproveitando o clique que trouxe a pessoa até aqui).
  // Se o navegador bloquear áudio automático, cai para mudo + aviso pra tocar.
  video.muted = false;
  var playPromise = video.play();
  if(playPromise && playPromise.catch){
    playPromise.then(function(){
      showMuteHint(false);
    }).catch(function(){
      video.muted = true;
      showMuteHint(true);
      video.play();
    });
  }

  muteHint.addEventListener('click', function(){
    video.muted = false;
    video.play();
    showMuteHint(false);
  });

  video.addEventListener('timeupdate', function(){
    if(!video.duration) return;
    var pct = (video.currentTime / video.duration) * 100;
    fill.style.width = pct + '%';
    if(!milestones.started){ milestones.started = true; track('vsl_started'); }
    if(pct >= 25 && !milestones[25]){ milestones[25] = true; track('vsl_25'); }
    if(pct >= 50 && !milestones[50]){ milestones[50] = true; track('vsl_50'); }
    if(pct >= 75 && !milestones[75]){ milestones[75] = true; track('vsl_75'); }
  });
  video.addEventListener('ended', function(){
    if(!milestones.completed){ milestones.completed = true; track('vsl_completed'); }
  });

  document.getElementById('vslCta').addEventListener('click', function(){ goTo(next('vsl')); });
};

      '</div>' +
    '</div>';
  }).join('');
  var dots = indices.map(function(_, i){
    return '<span class="dot' + (i === 0 ? ' active' : '') + '"></span>';
  }).join('');
  return '<div class="carousel">' +
    '<button class="carousel-arrow prev" id="' + prefix + 'Prev" aria-label="Anterior">‹</button>' +
    '<div class="carousel-track" id="' + prefix + 'Track">' + cards + '</div>' +
    '<button class="carousel-arrow next" id="' + prefix + 'Next" aria-label="Próximo">›</button>' +
    '<div class="carousel-dots" id="' + prefix + 'Dots">' + dots + '</div>' +

function bindCarousel(prefix){
  var track = document.getElementById(prefix + 'Track');
  var prev = document.getElementById(prefix + 'Prev');
  var next = document.getElementById(prefix + 'Next');
  var dots = document.getElementById(prefix + 'Dots').querySelectorAll('.dot');
  var galleryEl = document.getElementById(prefix + 'Gallery');
  var galleryItems = galleryEl ? galleryEl.querySelectorAll('.gallery-item') : null;
  if(!track) return;

  function scrollToIndex(i){
    track.scrollTo({ left: track.clientWidth * i, behavior:'smooth' });
  }
  function setActive(i){
    dots.forEach(function(d, idx){ d.classList.toggle('active', idx === i); });
    if(galleryItems){
      galleryItems.forEach(function(g, idx){ g.classList.toggle('active', idx === i); });
      var current = galleryItems[i];
      if(current) current.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }
  }
  prev.addEventListener('click', function(){
    var i = Math.round(track.scrollLeft / track.clientWidth);
    scrollToIndex(Math.max(0, i-1));
  });
  next.addEventListener('click', function(){
    var i = Math.round(track.scrollLeft / track.clientWidth);
    scrollToIndex(Math.min(track.children.length-1, i+1));
  });
  track.addEventListener('scroll', function(){
    var i = Math.round(track.scrollLeft / track.clientWidth);
    setActive(i);
  });
  if(galleryItems){
    galleryItems.forEach(function(g, idx){
      g.addEventListener('click', function(){ scrollToIndex(idx); });
    });
  }
}

function renderGallery(prefix, indices){
  var items = indices.map(function(idx, i){
    return '<div class="gallery-item' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">' +
      '<img class="gallery-photo" src="' + TESTIMONIAL_PHOTOS[idx] + '" alt="Trabalho de aluna em bordado japonês">' +
    '</div>';
  }).join('');
  return '<div class="gallery-scroll" id="' + prefix + 'Gallery">' + items + '</div>';
}
